apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: default
  labels:
    app: transaction-service
    group: group5-banking
spec:
  type: NodePort
  selector:
    app: transaction-service
  ports:
    - name: http
      protocol: TCP
      port: 3003          # ClusterIP port (internal service-to-service)
      targetPort: 3003    # Container port
      nodePort: 30003     # External port on Minikube node (access via minikube ip:30003)
