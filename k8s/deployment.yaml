apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service-deployment
  namespace: default
  labels:
    app: transaction-service
    group: group5-banking
    version: "1.0.0"
spec:
  replicas: 1           # SQLite is single-writer — keep at 1
  selector:
    matchLabels:
      app: transaction-service
  strategy:
    type: Recreate      # Required for PVC with ReadWriteOnce
  template:
    metadata:
      labels:
        app: transaction-service
        group: group5-banking
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3003"
    spec:
      containers:
        - name: transaction-service
          image: transaction-service:latest
          imagePullPolicy: IfNotPresent   # Use local Minikube image
          ports:
            - name: http
              containerPort: 3003

          # ── Environment from ConfigMap + Secret ─────────────────────────────
          envFrom:
            - configMapRef:
                name: transaction-service-config
            - secretRef:
                name: transaction-service-secret

          # ── Resource limits (Minikube-friendly) ─────────────────────────────
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ── Liveness probe — restarts pod if server hangs ───────────────────
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # ── Readiness probe — removes pod from LB until DB is ready ─────────
          readinessProbe:
            httpGet:
              path: /ready
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # ── Persistent volume for SQLite ─────────────────────────────────────
          volumeMounts:
            - name: data
              mountPath: /app/data

          # ── Startup probe — allows longer boot time for seed on first run ────
          startupProbe:
            httpGet:
              path: /ready
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12   # 60s total before giving up

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: transaction-service-pvc

      # Allow host network for cross-Minikube testing if needed
      # hostNetwork: false
