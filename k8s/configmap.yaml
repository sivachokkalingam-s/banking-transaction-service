apiVersion: v1
kind: ConfigMap
metadata:
  name: transaction-service-config
  namespace: default
  labels:
    app: transaction-service
    group: group5-banking
data:
  PORT: "3003"
  NODE_ENV: "production"
  SERVICE_NAME: "transaction-service"
  SERVICE_VERSION: "1.0.0"
  DB_PATH: "/app/data/transactions.db"
  LOG_LEVEL: "info"
  MASK_SENSITIVE: "true"

  # ── Business rules ─────────────────────────────────────────────────────────
  DAILY_TRANSFER_LIMIT: "200000"
  HIGH_VALUE_THRESHOLD: "50000"

  # ── Inter-service timeout / retry ──────────────────────────────────────────
  REQUEST_TIMEOUT_MS: "5000"
  MAX_RETRY_ATTEMPTS: "3"

  # ── Inter-service URLs (override these when connecting to teammates' services)
  # For same-cluster deployment (all services in one Minikube):
  ACCOUNT_SERVICE_URL: "http://account-service:3002"
  NOTIFICATION_SERVICE_URL: "http://notification-service:4104"
  #
  # For cross-machine / separate Minikube instances, comment the above
  # and set these to the teammate's NodePort addresses, e.g.:
  # ACCOUNT_SERVICE_URL: "http://192.168.49.2:30002"
  # NOTIFICATION_SERVICE_URL: "http://192.168.49.3:30104"
